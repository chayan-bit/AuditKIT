[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditkit"
version = "1.1.3"
description = "Evaluate any model on any dataset and any task — standalone, no platform required"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Lexsi Labs" }]
dependencies = []   # zero required third-party deps by design
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
openai      = ["openai"]
anthropic   = ["anthropic"]
# torch/transformers/vllm are version-locked to each other: vLLM pins an EXACT
# torch per release and drives the transformers floor. transformers>=5.15 is
# needed for North Micro Vision (cohere_compass); vLLM 0.30 is the first release
# on transformers 5.x that also registers CohereCompass, so the two extras
# co-resolve. torch is a floor only (no upper cap) so users can bring their own
# CUDA build.
transformers = ["torch>=2.4", "transformers>=5.15,<6", "peft"]   # peft: hf:<adapter dir>
lmeval      = ["lm-eval", "accelerate>=1.0"]   # accelerate: lm-eval's hf backend; transformers 5 refuses device_map below 1.x
vision      = ["pillow", "torchvision", "torchmetrics"]   # torchvision: transformers 5.x image processors need it
interop     = ["datasets", "mlcroissant", "GitPython"]   # GitPython: mlcroissant needs it for git-based repo downloads but doesn't declare it itself
mlflow      = ["mlflow"]
requests    = ["requests"]
jsonschema  = ["jsonschema"]   # JsonSchemaValid full-spec backend (a built-in subset validator is used without it)
# SGLang is NOT needed to evaluate an SGLang model: run `python -m sglang.launch_server`
# in its own env and point the `api:` backend at it -- that needs only [requests].
# This extra exists only for code that drives SGLang's offline Engine in-process.
# It is mutually exclusive with [vllm] and [transformers]: sglang 0.5.10+ pins
# transformers 5.x, and sglang/vllm never co-resolve (llguidance: e.g. vllm 0.16
# needs >=1.3,<1.4, sglang needs <0.8 or >=1.7.6; torch/xgrammar pins clash too).
# Resolved next to either, pip/uv silently fall back to sglang 0.5.9 (last on
# transformers 4.x) or 0.5.2 (frontend only) -- the >=0.5.18 floor turns that into
# a hard error. Excluded from `all` for the same reason. Linux only (manylinux_2_34,
# py3.10-3.13). sglang 0.5.20 pins the pre-release cuda-tile==1.6.0rc5, so uv needs
# `--prerelease=allow`. `auditkit.compat.check_compat()` diagnoses a mixed env.
sglang      = ["sglang>=0.5.18,<0.6"]
vllm        = ["vllm>=0.30"]   # first vLLM with CohereCompass; resolves with transformers 5.x
litellm     = ["litellm"]
bert-score  = ["bert-score", "torch>=2.4"]
relay       = ["flask", "werkzeug", "requests"]   # LexsiCompletionsRelay (lexsi_relay.py)
lexsi-sdk   = ["lexsi-sdk"]   # lexsi_login()/run_benchmark(lexsi_org=...) (lexsi_login.py) -- the only place it's imported
# pyyaml: tests/test_cli_yaml_model.py exercises `eval --config`, which needs it.
dev         = ["pytest", "pytest-asyncio", "pytest-mock", "pyyaml", "jsonschema"]
all         = [
    "auditkit[openai,anthropic,transformers,lmeval,vision,interop,mlflow,requests,jsonschema,vllm,litellm,bert-score,relay,lexsi-sdk,dev]",
]

[project.urls]
Homepage = "https://auditkit.lexsi.ai/"
Documentation = "https://auditkit.lexsi.ai/"
Repository = "https://github.com/Lexsi-Labs/AuditKIT"
Issues = "https://github.com/Lexsi-Labs/AuditKIT/issues"
Discord = "https://discord.gg/MhVUGVYE8q"

[project.scripts]
auditkit = "auditkit.cli:main"

# uv lock/sync only (pip ignores this): never try to co-resolve the extras above
# that cannot share an environment.
[tool.uv]
conflicts = [
    [{ extra = "sglang" }, { extra = "vllm" }],
    [{ extra = "sglang" }, { extra = "transformers" }],
]

[tool.hatch.build.targets.sdist]
# internal process docs, logs and working notes never ship (see AGENTS.md)
exclude = ["internal/", "docs/notes/"]

[tool.hatch.build.targets.wheel]
packages = ["src/auditkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/auditkit/assets/auditkit_logo.png" = "auditkit/assets/auditkit_logo.png"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
